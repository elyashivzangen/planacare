name: temp-assignment3-run
on:
  push:
    paths:
      - '.github/workflows/temp-assignment3.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib scikit-learn nbformat nbclient nbconvert ipykernel
          python -m ipykernel install --user --name python3 --display-name 'Python 3'
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Create and run assignment
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/temp_assignment3_runner.py
          python /tmp/temp_assignment3_runner.py
      - name: Upload completed assignment
        uses: actions/upload-artifact@v4
        with:
          name: assignment3-complete
          path: assignment3_output/
          retention-days: 1
